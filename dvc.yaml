stages:
  data-ingestion:
    cmd: python src\data\data-ingestion.py
    deps:
    - src\data\data-ingestion.py
    params:
    - data-ingestion.test_size
    outs:
    - data/raw
  data_preprocessing:
    cmd: python src\data\data_preprocessing.py --force
    deps:
    - data/raw
    - src\data\data_preprocessing.py
    outs:
    - data/interim
  feature_engineering:
    cmd: python src\features\feature_engineering.py
    deps:
    - data/interim
    - src\features\feature_engineering.py
    outs:
    - data/features
  model_building:
    cmd: python src\models\model_building.py
    deps:
    - data/features
    - src\models\model_building.py
    outs:
    - model.pkl
  model_evaluation:
    cmd: python src\models\model_evaluation.py
    deps:
    - model.pkl
    - src\models\model_evaluation.py
    metrics:
    - metrics.json
